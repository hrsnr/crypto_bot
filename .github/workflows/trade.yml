name: Gemini Crypto Trading Cycle

on:
  schedule:
    - cron: '17 */2 * * *'  #Startet alle 2 Stunden um Minute 17 (00:17, 02:17, 04:17 UTC usw.)
  workflow_dispatch:       # Erlaubt weiterhin manuelles Ausführen im Browser

permissions:
  contents: write

jobs:
  run-trader:
    timeout-minutes: 20
    concurrency:
      group: crypto-bot-trading
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Trading Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_state.json portfolio_history.csv trades_log.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: record trading cycle snapshot [skip ci]" && git push)
